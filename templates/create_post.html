<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Creaty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="bg-[#111827] border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-emerald-400 tracking-wider">Creaty</a>
            <a href="/" class="text-xs text-gray-400 hover:text-white transition">← Back to Feed</a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-[#111827] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-xl">
            <h1 class="text-xl font-bold text-white mb-2">Create a New Discussion</h1>
            <p class="text-xs text-gray-400 mb-6">Share your ideas, thoughts, or creative projects with everyone in the community.</p>

            {% if error %}
            <div class="bg-red-950/30 border border-red-800 text-red-300 text-xs px-4 py-3 rounded-xl mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form action="/create-post" method="POST" enctype="multipart/form-data" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Post Title</label>
                    <input type="text" name="title" required placeholder="e.g., Share your amazing idea or project title..." class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Detailed Description</label>
                    <textarea name="qustion" rows="6" required placeholder="Describe your thoughts, topic, or question in detail. Share context or information..." class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Solution Summary (Optional)</label>
                    <input type="text" name="solution" placeholder="Provide a brief summary or conclusion if resolved..." class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Category Hashtags</label>
                    <input type="text" name="tags" required placeholder="#ideas #creativity #general #projects" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                    <p class="text-[11px] text-gray-500 mt-1">Separate multiple tags with spaces (e.g., #creativity #ideas).</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Upload Images (Multiple allowed)</label>
                    <input type="file" name="images" multiple accept="image/*" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-900/20">Publish Post</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#111827] border-t border-gray-800 text-center py-5 text-xs text-gray-500 mt-12">
        Creaty • An Application by Medels
    </footer>

</body>
</html>
