<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Creaty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold text-white mb-2">Edit Profile</h2>
        <p class="text-xs text-gray-400 mb-6">Update your account details and settings.</p>

        {% if error %}
        <div class="bg-red-950/40 border border-red-800 text-red-300 text-xs p-3 rounded-xl mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/edit-profile" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Username</label>
                <input type="text" name="username" value="{{ user.username }}" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">
                    {% if user.email %}Rename Email{% else %}Add Email{% endif %}
                </label>
                <input type="email" name="email" value="{{ user.email if user.email else '' }}" placeholder="Enter email address" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                <p class="text-[11px] text-gray-400 mt-1.5 leading-relaxed">
                    We recommend providing an email address for enhanced account security and easy password recovery.
                </p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Bio</label>
                <textarea name="bio" rows="3" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">{{ user.bio }}</textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">New Password (leave blank to keep current)</label>
                <input type="password" name="new_password" placeholder="At least 8 characters" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Profile Picture</label>
                <input type="file" name="profile_pic" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-emerald-400 hover:file:bg-gray-700">
            </div>

            <div class="flex flex-col gap-2.5 pt-2">
                <div class="flex gap-3">
                    <button type="submit" class="flex-grow bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-semibold transition">Save Changes</button>
                    <a href="/profile" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-5 py-3 rounded-xl text-sm font-semibold transition text-center">Cancel</a>
                </div>
                <!-- Back to Feed Option -->
                <a href="/" class="w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 py-2.5 rounded-xl text-xs font-medium transition text-center">
                    ← Back to Feed
                </a>
            </div>
        </form>
    </div>
</body>
</html>
