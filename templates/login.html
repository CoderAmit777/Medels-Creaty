<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Creaty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Welcome Back</h2>
        <p class="text-xs text-gray-400 mb-6">Login to your Creaty account.</p>

        {% if error %}
        <div class="bg-red-950/40 border border-red-800 text-red-300 text-xs p-3 rounded-xl mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-gray-300">Password</label>
                    <a href="/forgot-password" class="text-xs text-emerald-400 hover:underline">Forgot password?</a>
                </div>
                <input type="password" name="password" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-semibold transition">Login</button>
        </form>

        <p class="text-xs text-gray-400 text-center mt-6">
            Don't have an account? <a href="/signup" class="text-emerald-400 font-medium hover:underline">Sign Up</a>
        </p>
    </div>
</body>
</html>
