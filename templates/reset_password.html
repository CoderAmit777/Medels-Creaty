<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Creaty</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090d0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e2e8f0; }
        .card { background: #111813; padding: 35px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #1e2920; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
        h2 { margin-bottom: 10px; color: #ffffff; text-align: center; font-size: 22px; font-weight: 700; }
        .brand { text-align: center; margin-bottom: 6px; color: #10b981; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 11px; margin-bottom: 15px; background: #090d0a; border: 1px solid #223026; border-radius: 6px; font-size: 14px; color: #ffffff; outline: none; }
        input:focus { border-color: #10b981; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 11px; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-reset { background: #10b981; color: #090d0a; }
        .btn-reset:hover { background: #059669; color: #ffffff; }
        .btn-skip { background: #1e2920; color: #cbd5e1; border: 1px solid #2a3b2e; }
        .btn-skip:hover { background: #26382c; color: #ffffff; }
        .error-msg { background: #2d1212; border: 1px solid #ef4444; color: #f87171; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Medels Security</div>
        <h2>Reset Password</h2>
        <p class="subtitle">Account verified for <b>@{{ username }}</b></p>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>New Password</label>
            <input type="password" name="new_password" placeholder="Enter new password">
            
            <div class="btn-group">
                <button type="submit" name="action" value="reset" class="btn-reset">Update Password</button>
                <button type="submit" name="action" value="skip" class="btn-skip" title="Skip password change and log in directly">Skip & Login</button>
            </div>
        </form>
    </div>
</body>
</html>
