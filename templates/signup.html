<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Creaty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Create Account</h2>
        <p class="text-xs text-gray-400 mb-6">Join the Creaty community today.</p>

        {% if error %}
        <div class="bg-red-950/40 border border-red-800 text-red-300 text-xs p-3 rounded-xl mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Email Address <span class="text-gray-500 font-normal">(Optional)</span></label>
                <input type="email" name="email" placeholder="name@example.com" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                <p class="text-[11px] text-gray-400 mt-1.5 leading-relaxed">
                    We recommend providing an email address for enhanced account security and easy password recovery.
                </p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                <input type="password" name="password" placeholder="At least 8 characters" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-semibold transition">Sign Up</button>
        </form>

        <p class="text-xs text-gray-400 text-center mt-6">
            Already have an account? <a href="/login" class="text-emerald-400 font-medium hover:underline">Login</a>
        </p>
    </div>
</body>
</html>
